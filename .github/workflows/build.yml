name: Build Windows

# Sur un tag "v*" (ex. v1.0.0) : tests, puis installeur + version portable attachés à la Release.
# Lançable aussi à la main (Actions > Build Windows > Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install pyinstaller pystray pillow

      - name: Tests
        run: python -m unittest tests.test_core -v

      - name: Version = tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          (Get-Content js8hrd/core.py -Encoding utf8) `
            -replace 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$ver`"" `
            | Set-Content js8hrd/core.py -Encoding utf8

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construire (portable + installeur)
        run: python packaging/build.py --portable --installer

      - uses: actions/upload-artifact@v4
        with:
          name: js8tohrd-windows
          path: |
            packaging/dist/JS8toHRD-portable.exe
            packaging/dist/JS8toHRD-Setup-*.exe

      - name: Publier sur la Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "JS8toHRD $tag" --notes-file .github/release-notes.md
          }
          $portable = (Get-ChildItem packaging/dist/JS8toHRD-portable.exe).FullName
          $setup    = (Get-ChildItem packaging/dist/JS8toHRD-Setup-*.exe).FullName
          gh release upload $tag $portable $setup --clobber
